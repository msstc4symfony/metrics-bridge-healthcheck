deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: '^Msstc4Symfony\\MetricsBridgeHealthcheck\\MetricsBridgeHealthcheckBundle$'

    ruleset:
        # The listener and the metric definition depend on nothing else in the bridge.
        Infrastructure: ~

        # The compiler pass appends the metric definition to metrics-bundle's enum list.
        DependencyInjection:
            - Infrastructure

        BundleRoot:
            - DependencyInjection
